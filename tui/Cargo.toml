[package]
name = "heatsync-tui"
version = "0.1.0"
edition = "2021"
description = "heat-sorted live multichat in the terminal — twitch + kick, real emotes, vim keys"
license = "MIT"
repository = "https://github.com/mellen9999/heatsync-tui"
homepage = "https://heatsync.org"
keywords = ["twitch", "kick", "chat", "streaming", "tui"]
categories = ["command-line-utilities"]

# The binary is `heatsync-tui`, not `heatsync`. An unrelated MIT project of the
# same name ships `heatsync-bin` on the AUR, and it declares both
# `provides: [heatsync]` and `conflicts: [heatsync]` — so installing /usr/bin/heatsync
# would make pacman refuse to have both on a machine. Ours predates theirs by
# ~19 months via the domain, but a file conflict makes US look like the squatter
# on the one shelf where a user meets us first.
[[bin]]
name = "heatsync-tui"
path = "src/main.rs"

[dependencies]
# crates.io rejects a bare `path` dep — the version is what it publishes against.
heatsync-core = { path = "../core", version = "0.1.0" }
ratatui = "0.29"
crossterm = "0.28"
# animated emote decode — pure-Rust, no libwebp/libgif C deps. lean feature set.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png", "jpeg"] }
# one shared palette per animated emote. without it every sixel frame is dithered
# independently and static regions shimmer between frames — that IS the flashing.
# already in the tree via image's gif codec; pure-Rust, no transitive deps.
color_quant = "1.1"
# live relay (blocking WS thread) + http (emote sets, corpus, image bytes). both
# rustls, no async runtime, no native-tls C dep — keeps the .exe clean.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
# kick oauth (PKCE): S256 challenge + random verifier. pure-rust, tiny.
sha2 = "0.10"
getrandom = "0.2"
# terminal graphics protocols (sixel/halfblock/kitty are core — no chafa C lib,
# no image-defaults codecs; we hand it already-decoded frames from `image`).
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }

# bare Linux console (TTY) pixel emotes — write straight to /dev/fb0, the same
# mechanism notcurses' NCPIXEL_LINUXFB uses, but pure-Rust + linux-only so the
# windows/mac .exe is unaffected.
[target.'cfg(target_os = "linux")'.dependencies]
framebuffer = "0.3"
