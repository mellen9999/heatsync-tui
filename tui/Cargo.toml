[package]
name = "heatsync-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "heatsync"
path = "src/main.rs"

[dependencies]
heatsync-core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
# animated emote decode — pure-Rust, no libwebp/libgif C deps. lean feature set.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png", "jpeg"] }
# live relay (blocking WS thread) + http (emote sets, corpus, image bytes). both
# rustls, no async runtime, no native-tls C dep — keeps the .exe clean.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
