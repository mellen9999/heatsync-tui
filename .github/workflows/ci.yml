name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # Never fail-fast: a windows-only or macos-only break is exactly the kind
      # of thing worth seeing in full rather than having its siblings cancelled.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Linux runners are headless. The gui smoke step below opens a real
      # window, so it needs a virtual display and the usual windowing libs.
      - name: Linux windowing deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libxkbcommon-x11-0 libxcb-render0 libxcb-shape0 libxcb-xfixes0 \
            libgl1-mesa-dri libegl1 libgles2

      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

      # Unit + e2e. The gui e2e drives the real widget tree through
      # egui_kittest/AccessKit, which needs no gpu and so runs everywhere.
      - run: cargo test --workspace

      - run: cargo build --release

      # The windows runner is a VM with no OpenGL driver, and glow hard-requires
      # OpenGL 2.0+ — without this the smoke dies on
      # `egui_glow requires opengl 2.0+`. Mesa's software opengl32.dll beside the
      # exe satisfies it: windows searches the exe's own directory before the
      # system one. Worth knowing this is not only a CI quirk — any windows box
      # without a GL driver (VM, RDP session, bare install) hits the same wall,
      # which is the standing argument for wgpu once wgpu-hal builds again.
      #
      # The whole x64 set is copied, not a hand-picked pair. Mesa's opengl32.dll
      # is a shim that loads libgallium_wgl.dll, which loads more again; naming
      # two of them produced `STATUS_DLL_NOT_FOUND` (0xc0000135) with no hint as
      # to which one was missing. Copying the set costs nothing on a runner and
      # cannot be wrong. An `-ErrorAction SilentlyContinue` here would likewise
      # turn "mesa changed its archive layout" into a GL failure three steps
      # later with nothing pointing at the cause.
      - name: Mesa software OpenGL (windows runners have no GL driver)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z'
          curl.exe -fsSL -o mesa.7z $url
          7z x mesa.7z -omesa | Out-Null
          $dlls = Get-ChildItem mesa\x64 -Filter *.dll
          if (-not ($dlls.Name -contains 'opengl32.dll')) {
            throw "mesa\x64 has no opengl32.dll — archive layout changed"
          }
          Write-Host "--- copying $($dlls.Count) mesa dlls beside the exe ---"
          $dlls | ForEach-Object {
            Write-Host "  $($_.Name)"
            Copy-Item $_.FullName target\release\ -Force
          }
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Append

      # The one thing the e2e above cannot cover: actually creating a window and
      # painting through glow. Windows is the primary target and OpenGL drivers
      # are where it differs most, so this is the step that stops "compiles on
      # windows" being mistaken for "runs on windows".
      #
      # Deliberately one step for all three platforms, run through git-bash on
      # windows. Two things it gets right that a per-platform script did not:
      #
      #   * The deadline is `timeout-minutes`, not a script. A window that never
      #     maps leaves eframe not calling the app at all, so no in-process guard
      #     can fire; the runner killing the step is the one guard that cannot be
      #     evaded, and unlike GNU `timeout` it exists on all three runners.
      #   * Nothing is redirected. The binary's stderr is the CI log. Capturing
      #     it to a file and printing it afterwards is how the first windows
      #     failure arrived as a bare `exit code 1` with the panic message left
      #     unflushed in a file nobody read.
      - name: GUI smoke (opens a window, renders, exits)
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          # `cargo run` rather than a hand-built path: it is the only spelling
          # that needs no per-platform `.exe` suffix and no assumption about
          # where the profile puts the binary. Hand-building it produced a bare
          # `exit 127` on windows with no message at all. Nothing rebuilds here
          # — the release build two steps up is already warm — and cargo echoes
          # the resolved path it runs, so a future move names itself.
          # Linux runners are headless; the other two have a real window server.
          if [ "$RUNNER_OS" = Linux ]; then
            exec xvfb-run -a cargo run --release -p heatsync-gui -- --smoke
          fi
          exec cargo run --release -p heatsync-gui -- --smoke

      # Windows is the primary target and the one platform with NO real-driver
      # verification available — there is no windows machine to hand, so CI is
      # the only thing that ever runs it. One software rasteriser passing is
      # thin evidence for "works on windows", so the smoke runs a second time
      # against a genuinely different GL implementation: mesa's d3d12 gallium
      # driver over WARP, rather than llvmpipe's CPU path. Different driver,
      # different shader compiler (dxil), same assertions.
      - name: GUI smoke again, on a different GL driver (d3d12/WARP)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        env:
          GALLIUM_DRIVER: d3d12
        run: exec cargo run --release -p heatsync-gui -- --smoke
