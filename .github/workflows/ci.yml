name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # Never fail-fast: a windows-only or macos-only break is exactly the kind
      # of thing worth seeing in full rather than having its siblings cancelled.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Linux runners are headless. The gui smoke step below opens a real
      # window, so it needs a virtual display and the usual windowing libs.
      - name: Linux windowing deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libxkbcommon-x11-0 libxcb-render0 libxcb-shape0 libxcb-xfixes0 \
            libgl1-mesa-dri libegl1 libgles2

      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

      # Unit + e2e. The gui e2e drives the real widget tree through
      # egui_kittest/AccessKit, which needs no gpu and so runs everywhere.
      - run: cargo test --workspace

      - run: cargo build --release

      # The one thing the e2e above cannot cover: actually creating a window and
      # painting through glow. Windows is the primary target and OpenGL drivers
      # are where it differs most, so this is the step that stops "compiles on
      # windows" being mistaken for "runs on windows".
      #
      # Wrapped in an external timeout on purpose. A window that never maps
      # leaves eframe not calling the app at all, so no in-process deadline can
      # fire — only killing it from outside is a guard that cannot be evaded.
      - name: GUI smoke (opens a window, renders, exits)
        if: runner.os == 'Linux'
        run: timeout 120 xvfb-run -a ./target/release/heatsync-gui --smoke

      # macOS has no GNU `timeout`; background it and poll instead of adding a
      # coreutils install just for this.
      - name: GUI smoke (opens a window, renders, exits)
        if: runner.os == 'macOS'
        run: |
          ./target/release/heatsync-gui --smoke &
          pid=$!
          for _ in $(seq 1 120); do
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          if kill -0 $pid 2>/dev/null; then
            kill $pid
            echo "gui smoke timed out: the window never rendered" >&2
            exit 1
          fi
          wait $pid

      # The windows runner is a VM with no OpenGL driver, and glow hard-requires
      # OpenGL 2.0+ — without this the smoke dies on
      # `egui_glow requires opengl 2.0+`. Mesa's software opengl32.dll next to
      # the exe satisfies it. Worth knowing that this is not only a CI quirk:
      # any windows box without a GL driver (VM, RDP session, bare install) hits
      # the same wall, which is an argument for wgpu once wgpu-hal builds again.
      - name: Mesa software OpenGL (windows runners have no GL driver)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z'
          curl.exe -L -o mesa.7z $url
          7z x mesa.7z -omesa | Out-Null
          Copy-Item mesa\x64\opengl32.dll  target\release\ -Force
          Copy-Item mesa\x64\libgallium_wgl.dll target\release\ -Force -ErrorAction SilentlyContinue
          Copy-Item mesa\x64\dxil.dll     target\release\ -Force -ErrorAction SilentlyContinue
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: GUI smoke (opens a window, renders, exits)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\target\release\heatsync-gui.exe `
                 -ArgumentList '--smoke' -PassThru -NoNewWindow `
                 -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            Write-Error "gui smoke timed out: the window never rendered"
            exit 1
          }
          Get-Content smoke.log, smoke.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
