name: release

# push a tag like v0.2.0 and this builds heatsync-tui for linux (glibc, static
# musl, arm64) and windows, then publishes a github release with the four files
# and a SHA256SUMS. the tag must match tui/Cargo.toml and CHANGELOG.md has to
# have a section for it; the release notes are that section.
#
# a manual run (workflow_dispatch) builds and smoke-tests the files and stops
# there, so they can be looked at before anything is published.
#
# every runner builds its own platform natively, so each binary is run once
# (`--version`) before it is uploaded. crates.io is not touched: `cargo
# publish` stays a by-hand step.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check tag, version, changelog
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' tui/Cargo.toml | head -n1)
          [ -n "$ver" ] || { echo "::error::no version found in tui/Cargo.toml"; exit 1; }
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$ver" ]; then
            echo "::error::tag $REF_NAME does not match tui/Cargo.toml version $ver"
            exit 1
          fi
          grep -q "^## $ver - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $ver - <date>' section"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35 floor (ubuntu 22.04): runs on anything from 2022 on
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: heatsync-tui-x86_64-linux
          # fully static: runs on any x86_64 linux, old or alpine
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: heatsync-tui-x86_64-linux-musl
          # native arm64 runner, so no cross toolchain
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: heatsync-tui-aarch64-linux
          # crt-static: no dependency on the visual c++ redistributable
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: heatsync-tui-x86_64-windows.exe
            rustflags: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
          rustc --version

      - name: musl compiler (ring builds c and asm)
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p heatsync-tui --target "${{ matrix.target }}"

      - name: name it, run it
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          mkdir dist
          cp "target/${{ matrix.target }}/release/heatsync-tui$ext" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          got=$("dist/${{ matrix.asset }}" --version | tr -d '\r')
          echo "$got"
          [ "$got" = "heatsync-tui $VERSION" ] \
            || { echo "::error::binary says '$got', expected 'heatsync-tui $VERSION'"; exit 1; }
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    # a manual run stops after build; only a tag publishes
    if: github.ref_type == 'tag'
    needs: [check, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: sums, notes, release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum heatsync-tui-* | tee SHA256SUMS)
          awk -v v="$VERSION" '$1 == "##" && $2 == v { on = 1; next } $1 == "##" { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no release notes for $VERSION in CHANGELOG.md"; exit 1; }
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
