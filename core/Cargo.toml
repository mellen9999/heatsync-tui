[package]
name = "heatsync-core"
version = "0.1.0"
edition = "2021"
description = "protocol types, heat ranking and emote resolution for heatsync — no terminal, async or io deps"
license = "MIT"
repository = "https://github.com/mellen9999/heatsync-tui"
homepage = "https://heatsync.org"
keywords = ["twitch", "kick", "chat", "streaming", "emotes"]
categories = ["api-bindings", "network-programming"]
readme = "README.md"

# the brain: protocol types, heat ramp, emote resolution, ws parsing.
# ZERO terminal/async/io deps — TUI and CLI are thin faces over this.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
