[package]
name = "heatsync-gui"
version = "0.1.0"
edition = "2021"
description = "heat-sorted live multichat on the desktop — twitch, kick + youtube in one window"
license = "MIT"
repository = "https://github.com/mellen9999/heatsync-tui"
homepage = "https://heatsync.org"
publish = false  # prototype: not on crates.io until M1 is real

[[bin]]
name = "heatsync-gui"
path = "src/main.rs"

[dependencies]
heatsync-core = { path = "../core", version = "0.1.0" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png", "jpeg"] }
