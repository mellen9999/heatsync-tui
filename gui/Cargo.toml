[package]
name = "heatsync-gui"
version = "0.1.0"
edition = "2021"
description = "heat-sorted live multichat on the desktop — twitch, kick + youtube in one window"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mellen9999/heatsync-tui"
homepage = "https://heatsync.org"
publish = false  # prototype: not on crates.io until M1 is real

[[bin]]
name = "heatsync-gui"
path = "src/main.rs"

[dependencies]
heatsync-core = { path = "../core", version = "0.1.0" }
# glow (OpenGL), not wgpu. A chat window is 2D text and quads — wgpu buys
# nothing here and drags in the whole wgpu-hal/D3D12 tree, which as of
# windows 0.62.2 does not compile on the windows runner at all. Fewer deps,
# smaller binary, and it is the backend that works everywhere.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png", "jpeg"] }

[dev-dependencies]
# AccessKit-based, so assertions read the accessibility tree rather than pixels
# — no gpu, which is what makes this runnable on all three CI runners.
egui_kittest = "0.36"
