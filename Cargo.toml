[workspace]
resolver = "2"
members = ["core", "tui"]

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
# unwind (+373KB): emote decode runs under catch_unwind so a hostile image becomes
# text instead of killing the app. other worker panics still abort (decode::install_hook).
panic = "unwind"
